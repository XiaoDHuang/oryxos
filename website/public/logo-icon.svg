<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Black rounded background -->
  <rect width="160" height="160" fill="#0a0a0a" rx="24"/>

  <!-- Layered hexagons - OS layers -->
  <!-- Bottom layer -->
  <path d="M80 95 L115 115 L115 135 L80 155 L45 135 L45 115 Z" fill="none" stroke="#404040" stroke-width="2"/>
  <!-- Middle layer -->
  <path d="M80 60 L120 83 L120 105 L80 128 L40 105 L40 83 Z" fill="none" stroke="url(#orangeGrad)" stroke-width="2.5"/>
  <!-- Top layer -->
  <path d="M80 25 L125 52 L125 75 L80 102 L35 75 L35 52 Z" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- Central core -->
  <circle cx="80" cy="68" r="12" fill="url(#orangeGrad)"/>
  <circle cx="80" cy="68" r="6" fill="#0a0a0a"/>

  <!-- Connection dots -->
  <circle cx="80" cy="35" r="4" fill="#ffffff"/>
  <circle cx="80" cy="95" r="4" fill="url(#orangeGrad)"/>
  <circle cx="80" cy="118" r="4" fill="#404040"/>
</svg>
