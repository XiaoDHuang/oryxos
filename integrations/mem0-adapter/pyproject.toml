[project]
name = "oryx-mem0-adapter"
version = "0.1.0"
description = "OryxOS受控记忆适配组件"
requires-python = "==3.12.14"
dependencies = [
    "mem0ai==1.0.11+oryx.1",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "psycopg[binary]==3.3.4",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pip-audit==2.10.1"]

[tool.uv]
package = false

[tool.uv.sources]
mem0ai = { path = "vendor/mem0ai-1.0.11+oryx.1-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra --strict-markers"
markers = ["integration: 必须显式提供隔离数据库与获准的服务配置"]
