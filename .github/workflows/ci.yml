name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and quality gates
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            mvn --batch-mode --no-transfer-progress clean verify
          else
            echo "::warning::NVD_API_KEY secret not set — skipping OWASP dependency-check (get a free key at https://nvd.nist.gov/developers/request-an-api-key)"
            mvn --batch-mode --no-transfer-progress -Ddependency-check.skip=true clean verify
          fi
