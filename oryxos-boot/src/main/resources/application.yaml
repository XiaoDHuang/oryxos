server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: oryxos
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # Do NOT use update on SQLite (weak ALTER TABLE). Schema owned by db/schema.sql.
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
  datasource:
    url: jdbc:sqlite:.oryxos/oryxos.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  # OpenAI-compatible Provider (DeepSeek / Kimi). Keys from env — never hardcode.
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}

# Sandbox whitelist keys are fixed by the technical solution.
file:
  allowed_paths:
    - .oryxos
shell:
  allowed_commands:
    - ls
    - cat
    - pwd
    - echo
http:
  allowed_domains:
    - api.openweathermap.org

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: OryxOS
    description: Enterprise Agent OS runtime
    version: ${ORYXOS_VERSION:1.0.0-SNAPSHOT}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.oryxos: DEBUG
