server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# 仅选择mem0时解析远端Secret；启用前仍须通过007运行门禁。
memory:
  backend: ${MEMORY_BACKEND:markdown}
  mem0:
    base-url: ${MEM0_BASE_URL}
    api-key: ${MEM0_API_KEY}
    workspace-id: ${MEM0_WORKSPACE_ID}
    connect-timeout: 3s
    read-timeout: 30s
    operation-timeout: 40s

spring:
  application:
    name: oryxos
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      # Agent 调用最长 60 秒,超时由 GlobalExceptionHandler 映射 504
      request-timeout: 60000
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # Do NOT use update on SQLite (weak ALTER TABLE). Schema owned by db/schema.sql.
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
  datasource:
    url: jdbc:sqlite:${oryxos.root:.oryxos}/oryxos.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
# Global provider layer: which LLM providers this instance connects to.
# Keys resolve from env vars only — never hardcode. Model choice belongs to each Profile.
oryxos:
  providers:
    - name: deepseek
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    - name: kimi
      api-key: ${KIMI_API_KEY:}
      base-url: ${KIMI_BASE_URL:https://api.moonshot.cn}

# Sandbox whitelist keys are fixed by the technical solution.
# 任一白名单置空（或缺省）= 该类动作全部拒绝，而非不校验；非法配置项启动期即失败。
file:
  allowed_paths:
    - .oryxos
shell:
  allowed_commands:
    - ls
    - cat
    - pwd
    - echo
http:
  allowed_domains:
    - api.openweathermap.org

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: OryxOS
    description: Enterprise Agent OS runtime
    version: ${ORYXOS_VERSION:1.0.0-SNAPSHOT}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.oryxos: DEBUG
